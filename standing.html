<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FIFA World Cup 2026 - Live Standings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&family=Inter&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = { theme: { extend: { colors: { "pitch-dark": "#020F2A", "primary": "#001e57" } } } }
    </script>
</head>
<body class="bg-gray-100 font-[Inter]">
    <main class="max-w-7xl mx-auto p-10">
        <div class="flex justify-between items-end mb-8">
            <h1 class="text-4xl font-[Outfit] font-black text-primary uppercase">Live Standings</h1>
            <button onclick="loadStandings()" class="bg-white px-4 py-2 rounded-xl font-bold border shadow-sm">Sync Data</button>
        </div>
        <div id="groupsGrid" class="grid grid-cols-1 xl:grid-cols-2 gap-8"></div>
    </main>

    <script>
        const sheetId = "1aKtJzVEGF7nidsJknMKL1X7vLMbZ0MEXddKRpiA_Vng"; 
        const gid = "1423494051";
        const sheetURI = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=${gid}`;

        function loadStandings() {
            fetch(sheetURI)
                .then(res => res.text())
                .then(data => {
                    const jsonData = JSON.parse(data.substring(data.indexOf("{"), data.lastIndexOf("}") + 1));
                    const groupsData = {};
                    jsonData.table.rows.forEach(row => {
                        if (!row.c[0] || !row.c[0].v) return;
                        let g = row.c[0].v;
                        if (!groupsData[g]) groupsData[g] = [];
                        groupsData[g].push({
                            name: row.c[1].v,
                            p: row.c[3].v, w: row.c[4].v, d: row.c[5].v, l: row.c[6].v,
                            gf: row.c[7].v, ga: row.c[8].v, gd: row.c[9].v, pts: row.c[10].v
                        });
                    });
                    render(groupsData);
                });
        }

        function render(groups) {
            const grid = document.getElementById('groupsGrid');
            grid.innerHTML = '';
            Object.keys(groups).sort().forEach(g => {
                grid.innerHTML += `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border">
                        <div class="font-[Outfit] font-black text-primary mb-4">GRUP ${g}</div>
                        <table class="w-full text-sm">
                            <thead class="text-gray-400 uppercase text-[10px]">
                                <tr><th class="p-2">Pos</th><th>Tim</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Pts</th></tr>
                            </thead>
                            <tbody>${groups[g].map((t, i) => `
                                <tr class="border-t text-center font-bold">
                                    <td class="p-3">${i+1}</td>
                                    <td class="text-left">${t.name}</td>
                                    <td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td>
                                    <td class="text-primary">${t.pts}</td>
                                </tr>`).join('')}
                            </tbody>
                        </table>
                    </div>`;
            });
        }
        loadStandings();
    </script>
</body>
</html>

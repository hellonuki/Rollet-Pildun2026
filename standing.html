<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>FIFA World Cup 2026 - Live Standings</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { "pitch-dark": "#020F2A", "prestige-gold": "#D4AF37", "surface-ice": "#EEF2FB", "primary": "#001e57" } } }
        }
    </script>
</head>
<body class="bg-surface-ice text-pitch-dark min-h-screen font-[Inter]">

<nav class="bg-pitch-dark shadow-lg sticky top-0 z-50 border-b border-white/10">
    <div class="flex justify-between items-center w-full px-4 md:px-12 max-w-7xl mx-auto h-20">
        <a href="index.html" class="font-[Outfit] font-black text-prestige-gold text-2xl flex items-center gap-3">
            <span class="material-symbols-outlined text-3xl">public</span> FIFA WORLD CUP™
        </a>
        <div class="hidden md:flex gap-8 font-bold text-white/70">
            <a href="index.html">Official Draw</a>
            <a href="standing.html" class="text-white border-b-2 border-prestige-gold pb-1">Live Standings</a>
        </div>
    </div>
</nav>

<main class="max-w-7xl w-full mx-auto px-4 md:px-12 py-10">
    <div class="mb-8 flex justify-between items-end">
        <div>
            <h1 class="font-[Outfit] text-4xl font-black text-primary uppercase">Live Standings</h1>
            <p class="text-gray-500 font-medium">Data sinkronisasi otomatis (API + Sheets).</p>
        </div>
        <button onclick="loadStandings()" class="bg-white border px-4 py-2 rounded-xl text-sm font-bold shadow-sm hover:bg-surface-ice flex items-center gap-2">
            <span class="material-symbols-outlined">sync</span> Refresh Data
        </button>
    </div>
    <div id="groupsGrid" class="grid grid-cols-1 xl:grid-cols-2 gap-8"></div>
</main>

<script>
    // 1. API TheSportsDB (Klasemen)
    const sportsDB_URI = "https://www.thesportsdb.com/api/v1/json/3/lookuptable.php?l=4429&s=2026";
    // 2. Google Sheets (Manajer)
    const sheetURI = "https://docs.google.com/spreadsheets/d/1aKtJzVEGF7nidsJknMKL1X7vLMbZ0MEXddKRpiA_Vng/gviz/tq?tqx=out:json&gid=1423494051";

    async function loadStandings() {
        const grid = document.getElementById('groupsGrid');
        grid.innerHTML = '<div class="text-center py-10">Mengambil data dari API...</div>';

        try {
            // Ambil kedua data sekaligus
            const [apiRes, sheetRes] = await Promise.all([
                fetch(sportsDB_URI),
                fetch(sheetURI).then(r => r.text())
            ]);

            const apiData = await apiRes.json();
            const sheetJson = JSON.parse(sheetRes.substring(sheetRes.indexOf("{"), sheetRes.lastIndexOf("}") + 1));

            // Mapping Manajer
            const managerMap = {};
            sheetJson.table.rows.forEach(row => {
                if (row.c[1] && row.c[2]) {
                    managerMap[row.c[1].v.toString().toLowerCase().trim()] = row.c[2].v;
                }
            });

            // Olah Data Klasemen
            const groups = {};
            apiData.table.forEach(team => {
                let g = team.strGroup;
                if (!groups[g]) groups[g] = [];
                groups[g].push({
                    name: team.strTeam,
                    manager: managerMap[team.strTeam.toLowerCase().trim()] || "Unlisted",
                    p: team.intPlayed, w: team.intWin, d: team.intDraw, l: team.intLoss,
                    pts: team.intPoints
                });
            });

            // Tampilkan ke layar
            grid.innerHTML = Object.keys(groups).sort().map(g => `
                <div class="bg-white rounded-2xl border p-5 shadow-sm">
                    <div class="bg-primary text-white px-4 py-2 rounded-xl font-black text-sm mb-3">${g}</div>
                    <table class="w-full text-xs text-left">
                        <thead class="text-gray-400 uppercase">
                            <tr><th class="p-2">Pos</th><th>Tim & Manajer</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Pts</th></tr>
                        </thead>
                        <tbody>${groups[g].map((t, i) => `
                            <tr class="border-t font-semibold">
                                <td class="p-3">${i+1}</td>
                                <td class="p-3 leading-tight">
                                    ${t.name}<br>
                                    <span class="text-[9px] text-gray-400">Man: ${t.manager}</span>
                                </td>
                                <td class="p-3">${t.p}</td><td class="p-3">${t.w}</td><td class="p-3">${t.d}</td><td class="p-3">${t.l}</td>
                                <td class="p-3 font-bold text-primary">${t.pts}</td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>`).join('');

        } catch (err) {
            grid.innerHTML = '<div class="text-center py-10 text-red-500">Gagal memuat data. Periksa koneksi atau Publish Sheets Anda.</div>';
        }
    }
    loadStandings();
</script>
</body>
</html>

<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>FIFA World Cup 2026 - Live Standings</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { "pitch-dark": "#020F2A", "prestige-gold": "#D4AF37", "surface-ice": "#EEF2FB", "primary": "#001e57" } } }
        }
    </script>
</head>
<body class="bg-surface-ice text-pitch-dark min-h-screen flex flex-col font-[Inter]">

<nav class="bg-pitch-dark shadow-lg sticky top-0 z-50 w-full border-b border-white/10">
    <div class="flex justify-between items-center w-full px-4 md:px-12 max-w-7xl mx-auto h-20">
        <a href="index.html" class="font-[Outfit] font-black text-prestige-gold text-2xl tracking-tighter flex items-center gap-3">
            <span class="material-symbols-outlined text-3xl">public</span> FIFA WORLD CUP™
        </a>
        <div class="hidden md:flex items-center gap-8 text-white/70 font-medium">
            <a href="index.html">Official Draw</a>
            <a href="standing.html" class="text-white font-bold border-b-2 border-prestige-gold pb-1">Live Standings</a>
        </div>
    </div>
</nav>

<main class="flex-grow max-w-7xl w-full mx-auto px-4 md:px-12 py-10">
    <div class="mb-8 flex justify-between items-end">
        <div>
            <h1 class="font-[Outfit] text-4xl font-black text-primary uppercase">Live Standings</h1>
            <p class="text-gray-500 font-medium">Data sinkronisasi otomatis dari Google Sheets.</p>
        </div>
        <button onclick="loadStandings()" class="bg-white border px-4 py-2 rounded-xl text-sm font-bold shadow-sm hover:bg-gray-100 flex items-center gap-2">
            <span class="material-symbols-outlined text-lg">sync</span> Refresh Data
        </button>
    </div>
    <div id="groupsGrid" class="grid grid-cols-1 xl:grid-cols-2 gap-8"></div>
</main>

<script>
    const sheetId = "1aKtJzVEGF7nidsJknMKL1X7vLMbZ0MEXddKRpiA_Vng"; 
    const gid = "1423494051";
    const sheetURI = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=${gid}`;

    function loadStandings() {
        fetch(sheetURI)
            .then(res => res.text())
            .then(data => {
                const jsonString = data.substring(data.indexOf("{"), data.lastIndexOf("}") + 1);
                const jsonData = JSON.parse(jsonString);
                const rows = jsonData.table.rows;
                const groupsData = {};

                rows.forEach(row => {
                    if (!row || !row.c || !row.c[0] || row.c[0].v === null) return;
                    
                    const getVal = (idx, fallback) => (row.c[idx] && row.c[idx].v !== null) ? row.c[idx].v : fallback;
                    
                    let group = getVal(0, 'Unknown').toString().trim();
                    if(group.toLowerCase() === 'group') return; 

                    if (!groupsData[group]) groupsData[group] = [];

                    groupsData[group].push({
                        name: getVal(1, ''),
                        manager: getVal(2, 'Unlisted'),
                        p: getVal(3, 0), w: getVal(4, 0), d: getVal(5, 0), l: getVal(6, 0),
                        gf: getVal(7, 0), ga: getVal(8, 0), gd: getVal(9, 0), pts: getVal(10, 0)
                    });
                });
                renderGroups(groupsData, Object.keys(groupsData).sort());
            });
    }

    function renderGroups(groupsData, groupNames) {
        const groupsGrid = document.getElementById('groupsGrid');
        groupsGrid.innerHTML = '';
        groupNames.forEach(groupLetter => {
            let tableRowsHTML = groupsData[groupLetter].map((team, idx) => `
                <tr class="border-b text-xs">
                    <td class="py-3 px-2 text-center font-bold">${idx + 1}</td>
                    <td class="py-3 px-3">
                        <span class="font-bold block">${team.name}</span>
                        <span class="text-[10px] text-gray-500">Man: ${team.manager}</span>
                    </td>
                    <td class="py-3 px-1 text-center font-mono">${team.p}</td>
                    <td class="py-3 px-1 text-center font-mono">${team.w}</td>
                    <td class="py-3 px-1 text-center font-mono">${team.d}</td>
                    <td class="py-3 px-1 text-center font-mono">${team.l}</td>
                    <td class="py-3 px-2 text-center font-mono font-bold">${team.pts}</td>
                </tr>
            `).join('');

            groupsGrid.innerHTML += `
                <div class="bg-white rounded-2xl border shadow-sm p-5">
                    <div class="bg-primary text-white px-4 py-2 rounded-lg font-bold text-sm mb-3 w-max">${groupLetter}</div>
                    <table class="w-full text-left">
                        <thead class="text-[10px] uppercase bg-gray-50 text-gray-500">
                            <tr><th class="p-2">Pos</th><th>Tim/Manajer</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Pts</th></tr>
                        </thead>
                        <tbody>${tableRowsHTML}</tbody>
                    </table>
                </div>`;
        });
    }
    loadStandings();
</script>
</body>
</html>

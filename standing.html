<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>FIFA World Cup 2026 - Tournament Standings</title>
    <meta name="description" content="Official tournament group standings strictly synchronized with the official FIFA World Cup 2026 grouping format." />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "pitch-dark": "#020F2A",
                        "fifa-blue": "#003284",
                        "vibrant-blue": "#0A84FF",
                        "prestige-gold": "#D4AF37",
                        "error-red": "#F43056",
                        "surface-ice": "#EEF2FB",
                        "on-surface": "#0d1b36",
                        "outline": "#747683",
                        "primary": "#001e57"
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface-ice text-pitch-dark min-h-screen flex flex-col font-[Inter]">

<nav class="bg-pitch-dark shadow-lg sticky top-0 z-50 w-full border-b border-white/10">
    <div class="flex justify-between items-center w-full px-4 md:px-12 max-w-7xl mx-auto h-20">
        <a href="index.html" class="font-[Outfit] font-black text-prestige-gold hover:text-white transition-colors flex items-center gap-3 text-2xl tracking-tighter">
            <span class="material-symbols-outlined text-3xl">public</span>
            FIFA WORLD CUP™
        </a>
        <div class="hidden md:flex items-center gap-8">
            <a class="font-medium text-white/70 hover:text-white transition-colors cursor-pointer" href="index.html">Official Draw</a>
            <a class="font-medium text-white/70 hover:text-white transition-colors cursor-pointer" href="teams.html">World Cup Teams</a>
            <a class="font-medium text-white/70 hover:text-white transition-colors cursor-pointer" href="result.html">Draw Ledger</a>
            <a class="font-bold text-white border-b-2 border-prestige-gold pb-1 cursor-pointer transition-all duration-200" href="standing.html">Tournament Standings</a>
        </div>
    </div>
</nav>

<main class="flex-grow max-w-7xl w-full mx-auto px-4 md:px-12 py-10">
    
    <div class="mb-8">
        <span class="inline-block bg-primary/10 text-primary px-4 py-1 rounded-full font-bold text-xs mb-3">OFFICIAL STAGE</span>
        <h1 class="font-[Outfit] text-4xl font-black tracking-tight text-primary uppercase">Tournament Standings</h1>
        
        <div class="mt-4 p-5 bg-white border border-outline/10 rounded-2xl shadow-sm text-xs text-pitch-dark/80 font-medium">
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-y-3 gap-x-6">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-emerald-500 block"></span>
                    <span>RESULT DRAWING PHASE 1</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="groupsGrid" class="grid grid-cols-1 xl:grid-cols-2 gap-8 mb-12"></div>

</main>

<script>
    // 1. DATA STRUKTUR 12 GRUP MUTLAK DAN RESMI DARI SITUS FIFA (48 NEGARA)
    const fifaOfficialGroups = {
        "A": [
            { name: "Mexico", flag: "🇲🇽", abbr: "MEX" },
            { name: "South Africa", flag: "🇿🇦", abbr: "RSA" },
            { name: "South Korea", flag: "🇰🇷", abbr: "KOR" },
            { name: "Czech Republic", flag: "🇨🇿", abbr: "CZE" }
        ],
        "B": [
            { name: "Canada", flag: "🇨🇦", abbr: "CAN" },
            { name: "Bosnia and Herzegovina", flag: "🇧🇦", abbr: "BIH" },
            { name: "Qatar", flag: "🇶🇦", abbr: "QAT" },
            { name: "Switzerland", flag: "🇨🇭", abbr: "SUI" }
        ],
        "C": [
            { name: "Brazil", flag: "🇧🇷", abbr: "BRA" },
            { name: "Morocco", flag: "🇲🇦", abbr: "MAR" },

        ],
        "D": [
            { name: "USA", flag: "🇺🇸", abbr: "USA" },
            { name: "Paraguay", flag: "🇵🇾", abbr: "PAR" },
            { name: "Australia", flag: "🇦🇺", abbr: "AUS" },
            { name: "Turkey", flag: "🇹🇷", abbr: "TUR" }
        ],
        "E": [
            { name: "Germany", flag: "🇩🇪", abbr: "GER" },
            { name: "Curaçao", flag: "🇨🇼", abbr: "CUW" },
            { name: "Ivory Coast", flag: "🇨🇮", abbr: "CIV" },
            { name: "Ecuador", flag: "🇪🇨", abbr: "ECU" }
        ],
        "F": [
            { name: "Netherlands", flag: "🇳🇱", abbr: "NED" },
            { name: "Japan", flag: "🇯🇵", abbr: "JPN" },
            { name: "Sweden", flag: "🇸🇪", abbr: "SWE" },
            { name: "Tunisia", flag: "🇹🇳", abbr: "TUN" }
        ],
        "G": [
            { name: "Belgium", flag: "🇧🇪", abbr: "BEL" },
            { name: "Egypt", flag: "🇪🇬", abbr: "EGY" },
            { name: "Iran", flag: "🇮🇷", abbr: "IRN" },
            { name: "New Zealand", flag: "🇳🇿", abbr: "NZL" }
        ],
        "H": [
            { name: "Spain", flag: "🇪🇸", abbr: "ESP" },
            { name: "Cape Verde", flag: "🇨🇻", abbr: "CPV" },
            { name: "Saudi Arabia", flag: "🇸🇦", abbr: "KSA" },
            { name: "Uruguay", flag: "🇺🇾", abbr: "URU" }
        ],
        "I": [
            { name: "France", flag: "🇫🇷", abbr: "FRA" },
            { name: "Senegal", flag: "🇸🇳", abbr: "SEN" },
            { name: "Iraq", flag: "🇮🇶", abbr: "IRQ" },
            { name: "Norway", flag: "🇳🇴", abbr: "NOR" }
        ],
        "J": [
            { name: "Argentina", flag: "🇦🇷", abbr: "ARG" },
            { name: "Algeria", flag: "🇩🇿", abbr: "ALG" },
            { name: "Austria", flag: "🇦🇹", abbr: "AUT" },
            { name: "Jordan", flag: "🇯🇴", abbr: "JOR" }
        ],
        "K": [
            { name: "Portugal", flag: "🇵🇹", abbr: "POR" },
            { name: "DR Congo", flag: "🇨🇩", abbr: "COD" },
            { name: "Uzbekistan", flag: "🇺🇿", abbr: "UZB" },
            { name: "Colombia", flag: "🇨🇴", abbr: "COL" }
        ],
        "L": [
            { name: "England", flag: "🏴󠁧󠁢󠁥󠁮󠁧󠁿", abbr: "ENG" },
            { name: "Croatia", flag: "🇭🇷", abbr: "CRO" },
            { name: "Ghana", flag: "🇬🇭", abbr: "GHA" },
            { name: "Panama", flag: "🇵🇦", abbr: "PAN" }
        ]
    };

    // 2. DATA MANAJER VALID HASIL DRAW EXCEL
    const validExcelManagers = {
        "Argentina": "Fernandi Alva Edisound",
        "Belgium": "Seto",
        "Senegal": "koy",
        "Germany": "Naufal",
        "Morocco": "Allan",
        "South Korea": "Tias",
        "Canada": "Rizal Amstrong",
        "Switzerland": "Nuki",
        "Brazil": "Ferdi Bikers",
        "Mexico": "Ubai",
        "Norway": "Azandy",
        "Colombia": "Greg",
        "Turkey": "Azka",
        "England": "Padil",
        "Czech Republic": "Prata",
        "Ecuador": "Aldi",
        "Netherlands": "Jovi",
        "Australia": "Mas Anies F5",
        "Portugal": "Bonge",
        "USA": "Efrian",
        "France": "Pangestu",
        "Austria": "Juan",
        "Iran": "Bowo",
        "Croatia": "HillMan",
        "Egypt": "Lail",
        "Japan": "Mas Albert",
        "Uruguay": "Belantong Logrythm",
        "Spain": "Malvin"
    };

    function buildOfficialFIFAStandings() {
        const groupsGrid = document.getElementById('groupsGrid');
        groupsGrid.innerHTML = '';

        Object.keys(fifaOfficialGroups).forEach(groupLetter => {
            const teamsInGroup = fifaOfficialGroups[groupLetter];
            
            const groupCard = document.createElement('div');
            groupCard.className = 'bg-white rounded-2xl border border-outline/10 shadow-sm p-5 flex flex-col';
            
            let tableRowsHTML = '';

            teamsInGroup.forEach((country, idx) => {
                const managerName = validExcelManagers[country.name];
                const displayManager = managerName ? `Man: ${managerName}` : `<span class="text-error-red font-bold bg-error-red/5 px-1.5 py-0.5 rounded text-[10px]">Unlisted</span>`;

                // Atur warna baris indikator kelolosan kualifikasi (Peringkat 1 & 2 teratas dapat warna penanda hijau lembut di sisi kirinya)
                const rankIndicatorClass = (idx < 2) ? 'border-l-4 border-emerald-500' : 'border-l-4 border-transparent';

                tableRowsHTML += `
                    <tr class="border-b border-outline/5 hover:bg-surface-ice/50 transition-colors text-xs font-semibold ${rankIndicatorClass}">
                        <td class="py-3 px-2 text-center text-outline font-bold">${idx + 1}</td>
                        <td class="py-3 px-3">
                            <div class="flex items-center gap-3">
                                <span class="text-2xl drop-shadow-sm">${country.flag}</span>
                                <div class="truncate">
                                    <span class="font-bold text-pitch-dark block truncate max-w-[135px] sm:max-w-[200px]">${country.name}</span>
                                    <span class="text-[10px] text-outline block truncate">${displayManager}</span>
                                </div>
                            </div>
                        </td>
                        <td class="py-3 px-1 text-center font-mono text-outline">0</td>
                        <td class="py-3 px-1 text-center font-mono text-outline">0</td>
                        <td class="py-3 px-1 text-center font-mono text-outline">0</td>
                        <td class="py-3 px-1 text-center font-mono text-outline">0</td>
                        <td class="py-3 px-1 text-center font-mono text-outline">0</td>
                        <td class="py-3 px-1 text-center font-mono text-outline">0</td>
                        <td class="py-3 px-1 text-center font-mono text-outline">0</td>
                        <td class="py-3 px-2 text-center font-mono font-bold text-primary bg-primary/5 rounded-md">0</td>
                    </tr>
                `;
            });

            groupCard.innerHTML = `
                <div class="bg-primary text-white px-4 py-2.5 rounded-xl font-[Outfit] font-black tracking-wide text-sm flex justify-between items-center mb-3 shadow-inner">
                    <span>GRUP ${groupLetter}</span>
                    <span class="text-[10px] text-prestige-gold uppercase tracking-widest font-bold">FIFA World Cup</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-outline/10 text-[10px] font-bold text-outline uppercase tracking-wider bg-surface-ice/30">
                                <th class="py-2 px-2 text-center w-8">Pos</th>
                                <th class="py-2 px-3">Tim & Manajer</th>
                                <th class="py-2 px-1 text-center w-8" title="Matches Played">P</th>
                                <th class="py-2 px-1 text-center w-8" title="Wins">W</th>
                                <th class="py-2 px-1 text-center w-8" title="Draws">D</th>
                                <th class="py-2 px-1 text-center w-8" title="Loss">L</th>
                                <th class="py-2 px-1 text-center w-8" title="Goals For">GF</th>
                                <th class="py-2 px-1 text-center w-8" title="Goals Against">GA</th>
                                <th class="py-2 px-1 text-center w-8" title="Goal Difference">GD</th>
                                <th class="py-2 px-2 text-center w-10 bg-primary/5 rounded-t-md text-primary">Pts</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRowsHTML}
                        </tbody>
                    </table>
                </div>
            `;
            groupsGrid.appendChild(groupCard);
        });
    }

    buildOfficialFIFAStandings();
</script>
</body>
</html>

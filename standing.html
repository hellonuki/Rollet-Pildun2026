<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet"/>

    <script id="tailwind-config">
        tailwind.config = {
            theme: { extend: { colors: { "pitch-dark": "#020F2A", "vibrant-blue": "#0A84FF", "prestige-gold": "#D4AF37", "error-red": "#F43056", "surface-ice": "#EEF2FB", "outline": "#747683", "primary": "#001e57" } } }

<body class="bg-surface-ice text-pitch-dark min-h-screen flex flex-col font-[Inter]">

<nav class="bg-pitch-dark shadow-lg sticky top-0 z-50 w-full border-b border-white/10">
    <div class="flex justify-between items-center w-full px-4 md:px-12 max-w-7xl mx-auto h-20">
        <a href="index.html" class="font-[Outfit] font-black text-prestige-gold text-2xl tracking-tighter flex items-center gap-3">
            <span class="material-symbols-outlined text-3xl">public</span> FIFA WORLD CUP™
        </a>
        <div class="hidden md:flex items-center gap-8 font-medium">
            <a class="text-white/70 hover:text-white transition-colors" href="index.html">Official Draw</a>
            <a class="font-bold text-white border-b-2 border-prestige-gold pb-1" href="standing.html">Live Standings</a>
        </div>
    </div>
</nav>

<main class="flex-grow max-w-7xl w-full mx-auto px-4 md:px-12 py-10">
    <div class="mb-8 flex justify-between items-end">
        <div>
            <h1 class="font-[Outfit] text-4xl font-black text-primary uppercase">Live Standings</h1>
            <p class="text-outline font-medium">Data tersinkronisasi real-time.</p>
        </div>
        <button onclick="loadStandings()" class="bg-white border border-outline/20 px-4 py-2 rounded-xl text-sm font-bold shadow-sm hover:bg-surface-ice flex items-center gap-2">
            <span class="material-symbols-outlined text-lg">sync</span> Refresh Data
        </button>
    </div>
    <div id="groupsGrid" class="grid grid-cols-1 xl:grid-cols-2 gap-8"></div>
</main>

<script>
    const worldTeamsMap = {
        "Mexico": { flag: "🇲🇽" }, "South Africa": { flag: "🇿🇦" }, "South Korea": { flag: "🇰🇷" }, "Czech Republic": { flag: "🇨🇿" },
        "Canada": { flag: "🇨🇦" }, "Bosnia and Herzegovina": { flag: "🇧🇦" }, "Qatar": { flag: "🇶🇦" }, "Switzerland": { flag: "🇨🇭" },
        "Brazil": { flag: "🇧🇷" }, "Morocco": { flag: "🇲🇦" }, "Haiti": { flag: "🇭🇹" }, "Scotland": { flag: "🏴󠁧󠁢󠁳󠁣󠁴󠁿" },
        "USA": { flag: "🇺🇸" }, "Paraguay": { flag: "🇵🇾" }, "Australia": { flag: "🇦🇺" }, "Turkey": { flag: "🇹🇷" },
        "Germany": { flag: "🇩🇪" }, "Curaçao": { flag: "🇨🇼" }, "Ivory Coast": { flag: "🇨🇮" }, "Ecuador": { flag: "🇪🇨" },
        "Netherlands": { flag: "🇳🇱" }, "Japan": { flag: "🇯🇵" }, "Sweden": { flag: "🇸🇪" }, "Tunisia": { flag: "🇹🇳" },
        "Belgium": { flag: "🇧🇪" }, "Egypt": { flag: "🇪🇬" }, "Iran": { flag: "🇮🇷" }, "New Zealand": { flag: "🇳🇿" },
        "Spain": { flag: "🇪🇸" }, "Cape Verde": { flag: "🇨🇻" }, "Saudi Arabia": { flag: "🇸🇦" }, "Uruguay": { flag: "🇺🇾" },
        "France": { flag: "🇫🇷" }, "Senegal": { flag: "🇸🇳" }, "Iraq": { flag: "🇮🇶" }, "Norway": { flag: "🇳🇴" },
        "Argentina": { flag: "🇦🇷" }, "Algeria": { flag: "🇩🇿" }, "Austria": { flag: "🇦🇹" }, "Jordan": { flag: "🇯🇴" },
        "Portugal": { flag: "🇵🇹" }, "DR Congo": { flag: "🇨🇩" }, "Uzbekistan": { flag: "🇺🇿" }, "Colombia": { flag: "🇨🇴" },
        "England": { flag: "🏴󠁧󠁢󠁥󠁮󠁧󠁿" }, "Croatia": { flag: "🇭🇷" }, "Ghana": { flag: "🇬🇭" }, "Panama": { flag: "🇵🇦" }
    };

    const sheetURI = "https://docs.google.com/spreadsheets/d/1aKtJzVEGF7nidsJknMKL1X7vLMbZ0MEXddKRpiA_Vng/gviz/tq?tqx=out:json&gid=1423494051";

    function loadStandings() {
        const grid = document.getElementById('groupsGrid');
        grid.innerHTML = '<div class="text-center py-10">Loading...</div>';

        fetch(sheetURI)
            .then(res => res.text())
            .then(data => {
                const json = JSON.parse(data.substring(data.indexOf("{"), data.lastIndexOf("}") + 1));
                const groups = {};
                json.table.rows.forEach(row => {
                    if (!row.c[0] || !row.c[0].v) return;
                    let g = row.c[0].v.toString().trim();
                    if (g.toLowerCase() === 'group') return;
                    if (!groups[g]) groups[g] = [];
                    groups[g].push({
                        name: row.c[1]?.v || '', manager: row.c[2]?.v || 'Unlisted',
                        p: row.c[3]?.v || 0, w: row.c[4]?.v || 0, d: row.c[5]?.v || 0, 
                        l: row.c[6]?.v || 0, gf: row.c[7]?.v || 0, ga: row.c[8]?.v || 0, 
                        gd: row.c[9]?.v || 0, pts: row.c[10]?.v || 0
                    });
                });
                render(groups);
            })
            .catch(err => { grid.innerHTML = 'Error loading data.'; });
    }

    function render(groups) {
        const grid = document.getElementById('groupsGrid');
        grid.innerHTML = '';
        Object.keys(groups).sort().forEach(g => {
            grid.innerHTML += `
                <div class="bg-white rounded-2xl border shadow-sm p-5">
                    <div class="bg-primary text-white px-4 py-2 rounded-lg font-black text-sm mb-3">GRUP ${g}</div>
                    <table class="w-full text-left text-xs">
                        <thead class="text-gray-400 uppercase">
                            <tr><th class="p-2">Pos</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Pts</th></tr>
                        </thead>
                        <tbody>${groups[g].map((t, i) => `
                            <tr class="border-t font-semibold">
                                <td class="p-3 text-center">${i+1}</td>
